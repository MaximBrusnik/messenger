services:
  # ================================================================
  #  Infrastructure
  # ================================================================
  postgres:
    image: postgres:15-alpine
    container_name: mm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mm-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: mm-nats
    command: ["-js", "-m", "8222", "-sd", "/data"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ================================================================
  #  Application services
  # ================================================================
  authservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: authservice
    container_name: mm-authservice
    image: ghcr.io/maximbrusnik/mm-authservice
    env_file:
      - .env
    environment:
      GRPC_PORT: "9000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: authservice
      MAX_USERS_ENABLED: ${MAX_USERS_ENABLED:-true}
      MAX_USERS_LIMIT: ${MAX_USERS_LIMIT:-200}
      SERVICE_USER_ADDR: userservice:9000
      SERVICE_CHAT_ADDR: chatservice:9000
      SERVICE_AUTH_ADDR: authservice:9000
    depends_on:
      postgres:
        condition: service_healthy

  userservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: userservice
    container_name: mm-userservice
    image: ghcr.io/maximbrusnik/mm-userservice
    env_file:
      - .env
    environment:
      GRPC_PORT: "9000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: userservice
      SERVICE_USER_ADDR: userservice:9000
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy

  chatservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: chatservice
    container_name: mm-chatservice
    image: ghcr.io/maximbrusnik/mm-chatservice
    env_file:
      - .env
    environment:
      GRPC_PORT: "9000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: chatservice
      SERVICE_USER_ADDR: userservice:9000
      SERVICE_CHAT_ADDR: chatservice:9000
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      userservice:
        condition: service_started

  musicservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: musicservice
    container_name: mm-musicservice
    image: ghcr.io/maximbrusnik/mm-musicservice
    env_file:
      - .env
    environment:
      GRPC_PORT: "9000"
      HTTP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: musicservice
      MUSIC_STORAGE_DIR: /app/music
      SERVICE_MUSIC_HTTP_ADDR: musicservice:8080
    volumes:
      - music-data:/app/music
    depends_on:
      postgres:
        condition: service_healthy

  pushservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: pushservice
    container_name: mm-pushservice
    image: ghcr.io/maximbrusnik/mm-pushservice
    env_file:
      - .env
    environment:
      GRPC_PORT: "9000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: pushservice
      SERVICE_PUSH_ADDR: pushservice:9000
      NATS_URL: nats://nats:4222
      REDIS_ADDR: redis:6379
    volumes:
      - ./secrets/firebase-creds.json:/app/secrets/firebase-creds.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  realtimeservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: realtimeservice
    container_name: mm-realtimeservice
    image: ghcr.io/maximbrusnik/mm-realtimeservice
    env_file:
      - .env
    environment:
      GRPC_PORT: "9000"
      HTTP_PORT: "8080"
      SERVICE_USER_ADDR: userservice:9000
      SERVICE_REALTIME_WS_ADDR: realtimeservice:8080
      NATS_URL: nats://nats:4222
      REDIS_ADDR: redis:6379
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      userservice:
        condition: service_started

  aiservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: aiservice
    container_name: mm-aiservice
    image: ghcr.io/maximbrusnik/mm-aiservice
    env_file:
      - .env
    environment:
      SERVICE_CHAT_ADDR: chatservice:9000
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
      chatservice:
        condition: service_started

  callsservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: callsservice
    container_name: mm-callsservice
    image: ghcr.io/maximbrusnik/mm-callsservice
    env_file:
      - .env
    environment:
      GRPC_PORT: "9000"
      HTTP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: callsservice
      SERVICE_CALLS_WS_ADDR: callsservice:8080
      SERVICE_CALLS_ADDR: callsservice:9000
      NATS_URL: nats://nats:4222
      REDIS_ADDR: redis:6379
      CALLS_STUN: stun:stun.l.google.com:19302
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  gatewayservice:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-gateway
      args:
        SERVICE: gatewayservice
    container_name: mm-gatewayservice
    image: ghcr.io/maximbrusnik/mm-gatewayservice
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SERVER_PORT: "8080"
      ENV: production
      FILE_STORAGE_DIR: /app/uploads
      SERVICE_USER_ADDR: userservice:9000
      SERVICE_CHAT_ADDR: chatservice:9000
      SERVICE_AUTH_ADDR: authservice:9000
      SERVICE_REALTIME_WS_ADDR: realtimeservice:8080
      SERVICE_MUSIC_HTTP_ADDR: musicservice:8080
      SERVICE_PUSH_ADDR: pushservice:9000
      SERVICE_CALLS_ADDR: callsservice:9000
      SERVICE_CALLS_WS_ADDR: callsservice:8080
    volumes:
      - uploads:/app/uploads
    depends_on:
      authservice:
        condition: service_started
      userservice:
        condition: service_started
      chatservice:
        condition: service_started
      musicservice:
        condition: service_started
      realtimeservice:
        condition: service_started
      callsservice:
        condition: service_started
      pushservice:
        condition: service_started

volumes:
  pg-data:
  uploads:
  music-data:
  nats-data: