services:
  # ================================================================
  #  Infrastructure
  # ================================================================
  postgres:
    image: postgres:15-alpine
    container_name: mm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mm-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: mm-nats
    command: ["-js", "-m", "8222", "-sd", "/data"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ================================================================
  #  Application services
  # ================================================================
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: auth
    container_name: mm-auth
    env_file:
      - .env
    environment:
      GRPC_PORT: "9000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: auth
      SERVICE_USER_ADDR: user-service:9000
      SERVICE_CHAT_ADDR: chat-service:9000
      SERVICE_AUTH_ADDR: auth-service:9000
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: user
    container_name: mm-user
    env_file:
      - .env
    environment:
      GRPC_PORT: "9000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: user
      SERVICE_USER_ADDR: user-service:9000
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: chat
    container_name: mm-chat
    env_file:
      - .env
    environment:
      GRPC_PORT: "9000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: chat
      SERVICE_USER_ADDR: user-service:9000
      SERVICE_CHAT_ADDR: chat-service:9000
      NATS_URL: nats://nats:4222
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      user-service:
        condition: service_started

  music-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: music
    container_name: mm-music
    env_file:
      - .env
    environment:
      GRPC_PORT: "9000"
      HTTP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: music
      MUSIC_STORAGE_DIR: /app/music
      SERVICE_MUSIC_HTTP_ADDR: music-service:8080
    volumes:
      - music-data:/app/music
    depends_on:
      postgres:
        condition: service_healthy

  push-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: push
    container_name: mm-push
    env_file:
      - .env
    environment:
      GRPC_PORT: "9000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: push
      SERVICE_PUSH_ADDR: push-service:9000
      NATS_URL: nats://nats:4222
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  realtime-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: realtime
    container_name: mm-realtime
    env_file:
      - .env
    environment:
      GRPC_PORT: "9000"
      HTTP_PORT: "8080"
      SERVICE_USER_ADDR: user-service:9000
      SERVICE_REALTIME_WS_ADDR: realtime-service:8080
      NATS_URL: nats://nats:4222
      REDIS_ADDR: redis:6379
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ai
    container_name: mm-ai
    env_file:
      - .env
    environment:
      SERVICE_CHAT_ADDR: chat-service:9000
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
      chat-service:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-gateway
      args:
        SERVICE: gateway
    container_name: mm-gateway
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SERVER_PORT: "8080"
      ENV: production
      FILE_STORAGE_DIR: /app/uploads
      SERVICE_USER_ADDR: user-service:9000
      SERVICE_CHAT_ADDR: chat-service:9000
      SERVICE_AUTH_ADDR: auth-service:9000
      SERVICE_REALTIME_WS_ADDR: realtime-service:8080
      SERVICE_MUSIC_HTTP_ADDR: music-service:8080
      SERVICE_PUSH_ADDR: push-service:9000
    volumes:
      - uploads:/app/uploads
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      chat-service:
        condition: service_started
      music-service:
        condition: service_started
      realtime-service:
        condition: service_started
      push-service:
        condition: service_started

volumes:
  pg-data:
  uploads:
  music-data:
  nats-data:
