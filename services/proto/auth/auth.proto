syntax = "proto3";

package messengermax.auth.v1;

option go_package = "messengermax/proto/gen/auth;pb";

import "google/protobuf/timestamp.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (AuthResponse);
  rpc ResendVerification(ResendVerificationRequest) returns (Empty);
  rpc Logout(LogoutRequest) returns (Empty);
  rpc ChangePassword(ChangePasswordRequest) returns (Empty);
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

// email — основной идентификатор для входа.
// Администратор по-прежнему может войти по username (legacy).
message LoginRequest {
  string email = 1;
  string password = 2;
}

message VerifyEmailRequest {
  string token = 1;
}

message ResendVerificationRequest {
  uint64 user_id = 1;
}

message LogoutRequest {
  uint64 user_id = 1;
}

message AuthResponse {
  string token = 1;
  bool email_verification_required = 2;
  User user = 3;
}

message User {
  uint64 id = 1;
  string username = 2;
  string email = 3;
  bool email_verified = 4;
  bool is_bot = 5;
  bool is_admin = 6;
  string status = 7;
  string avatar = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp last_login = 10;
}

message ChangePasswordRequest {
  uint64 user_id = 1;
  string old_password = 2;
  string new_password = 3;
}

message Empty {}
