syntax = "proto3";

package messengermax.auth.v1;

option go_package = "messengermax/proto/gen/auth;pb";

import "google/protobuf/timestamp.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (AuthResponse);
  rpc ResendVerification(ResendVerificationRequest) returns (Empty);
  rpc Logout(LogoutRequest) returns (Empty);
  rpc ChangePassword(ChangePasswordRequest) returns (Empty);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc AdminListUsers(AdminListUsersRequest) returns (AdminListUsersResponse);
  rpc AdminUserStats(Empty) returns (AdminStats);
  rpc AdminSetUserActive(AdminSetUserActiveRequest) returns (Empty);
  rpc AdminSetRole(AdminSetRoleRequest) returns (Empty);
  rpc AdminDeleteUser(AdminDeleteUserRequest) returns (Empty);
  rpc AdminRevokeSessions(AdminRevokeSessionsRequest) returns (Empty);
  rpc CheckUserActive(CheckUserActiveRequest) returns (CheckUserActiveResponse);
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string device_name = 4;
  string platform = 5;
  string device_fingerprint = 6;
  string ip = 7;
}

// email — основной идентификатор для входа.
// Администратор по-прежнему может войти по username (legacy).
message LoginRequest {
  string email = 1;
  string password = 2;
  string device_name = 3;
  string platform = 4;
  string device_fingerprint = 5;
  string ip = 6;
}

message VerifyEmailRequest {
  string token = 1;
  string device_name = 2;
  string platform = 3;
  string device_fingerprint = 4;
  string ip = 5;
}

message ResendVerificationRequest {
  uint64 user_id = 1;
}

message LogoutRequest {
  uint64 user_id = 1;
}

message AuthResponse {
  string token = 1;
  bool email_verification_required = 2;
  User user = 3;
}

message User {
  uint64 id = 1;
  string username = 2;
  string email = 3;
  bool email_verified = 4;
  bool is_bot = 5;
  bool is_admin = 6;
  string status = 7;
  string avatar = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp last_login = 10;
}

message ChangePasswordRequest {
  uint64 user_id = 1;
  string old_password = 2;
  string new_password = 3;
}

message ListSessionsRequest {
  uint64 user_id = 1;
  string current_jti = 2;
}

message ListSessionsResponse {
  repeated Device devices = 1;
}

message Device {
  string name = 1;
  string platform = 2;
  string ip = 3;
  google.protobuf.Timestamp first_login = 4;
  google.protobuf.Timestamp last_login = 5;
  uint32 login_count = 6;
  bool is_current = 7;
}

message AdminListUsersRequest {
  string query = 1;
  uint32 page = 2;
  uint32 page_size = 3;
  optional bool is_bot = 4;
  optional bool is_admin = 5;
  optional bool active = 6;
}

message AdminListUsersResponse {
  repeated AdminUser users = 1;
  uint64 total = 2;
}

message AdminUser {
  uint64 id = 1;
  string username = 2;
  string email = 3;
  bool email_verified = 4;
  bool is_bot = 5;
  bool is_admin = 6;
  bool is_active = 7;
  string status = 8;
  string avatar = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp last_login = 11;
}

message AdminStats {
  uint64 total_users = 1;
  uint64 active_users = 2;
  uint64 banned_users = 3;
  uint64 unverified_users = 4;
  uint64 bots = 5;
  uint64 admins = 6;
  uint64 new_last_7days = 7;
}

message AdminSetUserActiveRequest {
  uint64 user_id = 1;
  bool active = 2;
}

message AdminSetRoleRequest {
  uint64 user_id = 1;
  bool is_admin = 2;
}

message AdminDeleteUserRequest {
  uint64 user_id = 1;
}

message AdminRevokeSessionsRequest {
  uint64 user_id = 1;
}

message CheckUserActiveRequest {
  uint64 user_id = 1;
}

message CheckUserActiveResponse {
  bool active = 1;
  bool found = 2;
}

message Empty {}
